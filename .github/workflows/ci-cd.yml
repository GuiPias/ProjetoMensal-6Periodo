name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  test-backend:
    name: Lint e testes do backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências do backend
        working-directory: backend
        run: npm install

      - name: Análise de dependências (npm audit)
        working-directory: backend
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Rodar lint
        working-directory: backend
        run: npm run lint

      - name: Rodar testes
        working-directory: backend
        run: npm test

  test-frontend:
    name: Lint e testes do frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm install

      - name: Análise de dependências (npm audit)
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Rodar lint
        working-directory: frontend
        run: npm run lint

      - name: Rodar testes
        working-directory: frontend
        run: npm test

  deploy:
    name: Deploy na EC2
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH na EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/ProjetoMensal-6Periodo
            git pull
            docker compose up -d --build

      - name: Validação pós-deploy (health check)
        run: |
          sleep 10
          curl --fail --silent --show-error http://18.230.245.38:3001/health
