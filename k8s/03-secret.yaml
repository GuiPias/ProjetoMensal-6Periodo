# Valores sensíveis. Use `stringData` apenas para fins didáticos/locais (Minikube);
# em produção, troque esses valores e evite versionar segredos reais em texto puro.
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "troque_esta_senha_root"
  MYSQL_PASSWORD: "troque_esta_senha_app_user"
  JWT_SECRET: "troque_este_segredo_em_producao"
